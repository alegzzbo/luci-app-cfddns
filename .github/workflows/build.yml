name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # stable    -> current OpenWrt release (apk based, .apk package)
        # oldstable -> previous release series (opkg based, .ipk package)
        channel: [ stable, oldstable ]
    env:
      PKG: luci-app-cfddns
      # The package is architecture independent (PKGARCH:=all), any target works.
      TARGET: x86/64

    steps:
      - uses: actions/checkout@v4

      - name: Sync PKG_VERSION with tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${GITHUB_REF_NAME#v}"
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${ver}/" Makefile
          echo "Set PKG_VERSION to ${ver}"
          grep '^PKG_VERSION:=' Makefile

      - name: Resolve OpenWrt version
        id: ver
        run: |
          set -e
          json=$(curl -fsSL https://downloads.openwrt.org/.versions.json)
          case "${{ matrix.channel }}" in
            stable)    v=$(echo "$json" | jq -r '.stable_version') ;;
            oldstable) v=$(echo "$json" | jq -r '.oldstable_version') ;;
          esac
          if [ -z "$v" ] || [ "$v" = "null" ]; then
            echo "Can't resolve OpenWrt version for ${{ matrix.channel }}"
            exit 1
          fi
          echo "OpenWrt $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget zstd

      - name: Cache SDK archive
        uses: actions/cache@v4
        with:
          path: sdk-dl
          key: sdk-${{ steps.ver.outputs.version }}

      - name: Download OpenWrt SDK
        run: |
          set -e
          base="https://downloads.openwrt.org/releases/${{ steps.ver.outputs.version }}/targets/${TARGET}"
          mkdir -p sdk-dl
          if ! ls sdk-dl/openwrt-sdk-* >/dev/null 2>&1; then
            curl -fsSL "$base/sha256sums" -o sdk-dl/sha256sums
            line=$(grep -E ' \*?openwrt-sdk-' sdk-dl/sha256sums | head -n1)
            file=$(echo "$line" | sed 's/^[0-9a-f]* \*\?//')
            echo "SDK: $file"
            curl -fsSL "$base/$file" -o "sdk-dl/$file"
            (cd sdk-dl && echo "$line" | sha256sum -c -)
          fi
          mkdir sdk
          tar -xf sdk-dl/openwrt-sdk-* -C sdk --strip-components=1

      - name: Update feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add package to SDK
        run: rsync -a --exclude '.git' --exclude '.github'       - name: Add package to SDK
        run: rsync -a --exclude '.git' --exclude '.github' --exclude 'sdk' --exclude 'sdk-dl' ./ "sdk/package/${PKG}/" ./ "sdk/package/${PKG}/"

      - name: Build package
        working-directory: sdk
        run: |
          echo "CONFIG_PACKAGE_${PKG}=m" >> .config
          make defconfig
          make "package/${PKG}/compile" V=s

      - name: Collect package
        run: |
          mkdir dist
          find sdk/bin \( -name "${PKG}*.apk" -o -name "${PKG}*.ipk" \) -exec cp -v {} dist/ \;
          if [ -z "$(ls -A dist)" ]; then
            echo "No package was built"
            exit 1
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}-${{ matrix.channel }}
          path: dist/*
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
